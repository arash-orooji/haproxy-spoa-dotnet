[sharepoint-guard]
spoe-agent sharepoint-guard-agent
  messages           sharepoint-guard
  option var-prefix  spguard
  option set-on-error error
  use-backend        spguard_agents
  timeout hello      2s
  timeout idle       2m
  timeout processing 500ms

spoe-message sharepoint-guard
  args method=method path=path query=query referer=req.hdr(referer) authorization=req.hdr(authorization) prooftoken=req.hdr(x-proof_token) src=src
  event on-frontend-http-request
