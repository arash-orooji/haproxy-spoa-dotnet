global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client  50s
  timeout server  50s

frontend sharepoint
  bind :80
  filter spoe engine sharepoint-guard config /usr/local/etc/haproxy/spoe.conf

  # Requests the agent flagged are refused, with the matching rule id in a header.
  http-request deny deny_status 403 content-type text/plain hdr X-SPGuard-Rule %[var(txn.spguard.rule)] lf-string "Blocked by SharePoint Guard (%[var(txn.spguard.rule)])\n" if { var(txn.spguard.block) -m int eq 1 }

  # Fail closed: if the agent is down or times out, refuse the request.
  http-request deny deny_status 503 content-type text/plain string "SharePoint Guard unavailable\n" if { var(txn.spguard.error) -m found }

  default_backend sharepoint_servers

backend sharepoint_servers
  # Replace with your SharePoint Server Subscription Edition web front ends.
  server sp1 127.0.0.1:8080

# Stand-in for SharePoint so the setup can be tested without a farm.
listen sharepoint_mock
  bind 127.0.0.1:8080
  http-request return status 200 content-type text/plain lf-string "SharePoint mock: %[method] %[path]\n"

backend spguard_agents
  mode spop
  timeout connect 5s
  timeout server  3m
  server agent1 agent:12345 check
